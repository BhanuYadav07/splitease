spring.application.name=splitease-backend
spring.datasource.url=Database_URL

spring.datasource.username=Database_UserName
spring.datasource.password=Database_Password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

splitease.jwt.secret=JWT_SECRET
splitease.jwt.expiration-ms=86400000

app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.mail-lock-minutes=15
app.otp.resend-cooldown-seconds=60

brevo.api-key=Mail_API
brevo.from=Sender_mail
