spring.application.name=splitease-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splitease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

splitease.jwt.secret=${JWT_SECRET}
splitease.jwt.expiration-ms=86400000

# A code is live for 5 minutes, the shared guess budget is 3 wrong codes/passwords,
# running out pauses mail (and login) for 15 minutes, and two emails to one address
# are at least 60s apart.
app.otp.expiry-minutes=5
app.otp.max-attempts=3
app.otp.mail-lock-minutes=15
app.otp.resend-cooldown-seconds=60

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.com.splitease=INFO
