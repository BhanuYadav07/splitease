spring.application.name=splitease-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splitease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8081}

splitease.jwt.secret=${JWT_SECRET}
splitease.jwt.expiration-ms=86400000

app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.mail-lock-days=3

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username={Google_GMAIL}
spring.mail.password={Password}
#idsw quzr oatq qqty
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.splitease=INFO